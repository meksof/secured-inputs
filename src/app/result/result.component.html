<div class="result">
    <ng-container *ngIf="isMatched else empty;">
        <div class="text success">You guessed the right password!!</div>
        <a [routerLink]="'/'" class="link">Go home</a>
    </ng-container>
</div>
<ng-template #empty>
    <div class="text error">You are here by accident,<br /> you should go back to your guess machine.</div>
    <a [routerLink]="'/'" class="link">Go home</a>
</ng-template>
